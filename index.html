<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b3261e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="忘年会">
  <title>忘年会 参加管理</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>忘年会 参加管理</h1>
    <div class="header-actions">
      <button id="me-btn" class="chip" type="button"></button>
      <button id="refresh-btn" class="icon-btn" type="button" aria-label="更新">⟳</button>
    </div>
  </header>

  <section id="info" class="info" hidden></section>

  <nav class="tabs" role="tablist">
    <button class="tab" data-tab="call" role="tab">声掛け</button>
    <button class="tab" data-tab="attend" role="tab">参加管理</button>
    <button class="tab" data-tab="members" role="tab">メンバー</button>
  </nav>

  <div id="class-filter" class="class-filter">
    <button data-cls="all">全員</button>
    <button data-cls="1組">1組</button>
    <button data-cls="2組">2組</button>
  </div>

  <div class="search">
    <input id="search" type="search" placeholder="🔍 名前で検索（一部でもOK）" autocomplete="off" enterkeyhint="search">
  </div>

  <main>
    <section id="tab-call" class="panel"></section>
    <section id="tab-attend" class="panel"></section>
    <section id="tab-members" class="panel">
      <form id="add-form" class="add-form">
        <select id="add-class" class="class-select" aria-label="クラス"></select>
        <input id="add-last" type="text" placeholder="姓" autocomplete="off" enterkeyhint="next">
        <input id="add-first" type="text" placeholder="名" autocomplete="off" enterkeyhint="done">
        <button type="submit" class="primary">追加</button>
      </form>
      <p id="add-error" class="error" hidden></p>

      <details class="bulk">
        <summary>まとめて追加</summary>
        <p class="hint">クラスを選んでから、1行に1人「姓 名」の形で貼り付けてください（例：池田 紀代子）。登録済みの名前は飛ばします</p>
        <select id="bulk-class" aria-label="クラス"></select>
        <textarea id="bulk-names" rows="8" placeholder="池田 紀代子&#10;桶野 百子"></textarea>
        <p id="bulk-error" class="error" hidden></p>
        <button id="bulk-btn" type="button" class="primary">まとめて追加</button>
      </details>

      <div id="member-list"></div>
    </section>
  </main>

  <!-- 声をかけた人の選択 -->
  <dialog id="caller-dialog">
    <form method="dialog">
      <h2 id="caller-title"></h2>
      <label>声をかけた人
        <select id="caller-select"></select>
      </label>
      <input id="caller-other" type="text" placeholder="名前を入力" hidden>
      <div class="dialog-actions">
        <button value="cancel" type="submit">キャンセル</button>
        <button value="ok" type="submit" class="primary">記録する</button>
      </div>
    </form>
  </dialog>

  <!-- 自分の名前の選択 -->
  <dialog id="me-dialog">
    <form method="dialog">
      <h2>あなたの名前</h2>
      <p class="hint">選んだ名前は「声をかけた人」の初期値になります（この端末に保存）</p>
      <select id="me-select"></select>
      <div class="dialog-actions">
        <button value="cancel" type="submit">キャンセル</button>
        <button value="ok" type="submit" class="primary">決定</button>
      </div>
    </form>
  </dialog>

  <!-- 名前の編集 -->
  <dialog id="edit-dialog">
    <form method="dialog">
      <h2>名前を編集</h2>
      <select id="edit-class" aria-label="クラス"></select>
      <div class="name-inputs">
        <input id="edit-last" type="text" placeholder="姓" autocomplete="off">
        <input id="edit-first" type="text" placeholder="名" autocomplete="off">
      </div>
      <p id="edit-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button value="cancel" type="submit">キャンセル</button>
        <button value="ok" type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <div id="busy" class="busy" hidden role="status" aria-live="polite">
    <div class="busy-box">
      <div class="spinner"></div>
      <p id="busy-text">保存中…</p>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
